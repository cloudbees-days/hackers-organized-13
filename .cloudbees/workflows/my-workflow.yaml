apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: A sample manifest should go here, to help user
metadata:
  stages/v1alpha1:
    - name: DOW Staging
      jobs:
        - deploy-to-DOW Staging
    - name: DOW Production
      jobs:
        - deploy-to-DOW Production
jobs:
  deploy-to-DOW Staging:
    steps:
      - name: Deploy to DOW Staging
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "Deploying to DOW Staging"
  deploy-to-DOW Production:
    needs:
      - deploy-to-DOW Staging
    steps:
      - name: Deploy to DOW Production
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "Deploying to DOW Production"
